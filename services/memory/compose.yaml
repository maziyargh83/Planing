services:
  memory:
    build: .
    ports: ["127.0.0.1:4780:4780"]
    environment:
      GAAM_MEMORY_TOKEN: ${GAAM_MEMORY_TOKEN:?Set a token in your shell}
      OLLAMA_URL: http://host.docker.internal:11434
      MEMORY_MODEL: ${MEMORY_MODEL:-qwen3:8b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set a database password in your shell}
      GRAPH_MODEL: ${GRAPH_MODEL:-qwen3:8b}
    volumes: ["memory-data:/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      neo4j:
        condition: service_healthy
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set a database password in your shell}
    volumes: ["graph-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  memory-data:
  graph-data:
